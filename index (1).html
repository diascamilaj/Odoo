</script>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --green-900:#103216;
  --green-700:#246A32;
  --green-600:#2C813C;
  --green-500:#329244;
  --green-400:#3CAF51;
  --green-100:#E8F2EA;
  --green-50:#F4F8F5;
  --gray-900:#16211D;
  --gray-700:#3D4A44;
  --gray-500:#6B7A73;
  --gray-300:#D7E0DB;
  --gray-200:#E7ECE9;
  --gray-100:#F2F5F3;
  --white:#FFFFFF;
  --bg:#F5F7F6;
  --red-600:#DC2626;
  --red-50:#FDF0EF;
  --amber-600:#D97706;
  --amber-50:#FEF6E7;
  --blue-600:#2563AA;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(16,40,30,0.06), 0 1px 1px rgba(16,40,30,0.04);
  --shadow-md:0 4px 16px rgba(16,40,30,0.08);
  --shadow-lg:0 12px 32px rgba(16,40,30,0.12);
  --font-display:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--gray-900);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--gray-300); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--gray-500);}
button{font-family:inherit; cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;}
.mono-num{font-variant-numeric:tabular-nums;}

/* ============ APP SHELL ============ */
.app{display:flex; min-height:100vh;}

/* ---- Sidebar ---- */
.sidebar{
  width:236px; flex-shrink:0;
  background:linear-gradient(180deg, var(--green-900) 0%, #153F1D 100%);
  color:var(--white);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  z-index:40;
}
.sidebar-brand{
  padding:24px 20px 18px 20px;
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-brand .logo-mark{
  width:34px; height:34px; border-radius:9px;
  background:var(--green-400);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:800; color:var(--green-900); font-size:15px;
  flex-shrink:0;
}
.sidebar-brand .logo-text{font-family:var(--font-display); font-weight:800; font-size:15.5px; letter-spacing:0.2px;}
.sidebar-brand .logo-sub{font-size:10.5px; color:rgba(255,255,255,0.55); font-weight:500; letter-spacing:0.4px; margin-top:1px;}

.sidebar-nav{flex:1; padding:14px 12px; overflow-y:auto;}
.nav-section-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px;
  color:rgba(255,255,255,0.4); font-weight:700;
  padding:14px 10px 6px 10px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:9px;
  color:rgba(255,255,255,0.75);
  font-size:13.4px; font-weight:600;
  cursor:pointer; transition:background 0.15s ease, color 0.15s ease;
  margin-bottom:2px;
  position:relative;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:0.85;}
.nav-item:hover{background:rgba(255,255,255,0.08); color:var(--white);}
.nav-item.active{background:rgba(255,255,255,0.14); color:var(--white);}
.nav-item.active::before{
  content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
  width:3px; height:18px; background:var(--green-400); border-radius:0 3px 3px 0;
}
.sidebar-footer{
  padding:14px 20px; border-top:1px solid rgba(255,255,255,0.08);
  font-size:11px; color:rgba(255,255,255,0.4);
}

/* ---- Main column ---- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}

/* ---- Topbar ---- */
.topbar{
  background:var(--white); border-bottom:1px solid var(--gray-200);
  padding:16px 28px; position:sticky; top:0; z-index:30;
  box-shadow:0 1px 0 rgba(16,40,30,0.02);
}
.topbar-row1{display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:14px;}
.page-title{font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--gray-900);}
.page-subtitle{font-size:12.5px; color:var(--gray-500); margin-top:2px; font-weight:500;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--gray-100); border:1px solid var(--gray-200);
  border-radius:10px; padding:8px 12px; width:250px;
  transition:border-color 0.15s;
}
.search-box:focus-within{border-color:var(--green-500); background:var(--white);}
.search-box svg{width:15px; height:15px; color:var(--gray-500); flex-shrink:0;}
.search-box input{border:none; background:transparent; outline:none; font-size:13px; width:100%; color:var(--gray-900);}
.update-pill{
  display:flex; align-items:center; gap:6px;
  background:var(--green-50); color:var(--green-700);
  border:1px solid var(--green-100); border-radius:20px;
  padding:6px 12px; font-size:11.5px; font-weight:600;
}
.update-pill .dot{width:6px; height:6px; border-radius:50%; background:var(--green-500); animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}

/* ---- Filters bar ---- */
.filters-bar{display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap;}
.filter-field{display:flex; flex-direction:column; gap:4px;}
.filter-field label{font-size:10.5px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.5px;}
.filter-field select, .filter-field input[type=date]{
  border:1px solid var(--gray-200); background:var(--white);
  border-radius:8px; padding:7px 10px; font-size:12.5px; color:var(--gray-900);
  min-width:130px; outline:none; transition:border-color 0.15s;
  font-weight:500;
}
.filter-field select:focus, .filter-field input:focus{border-color:var(--green-500);}
.seg-control{
  display:flex; background:var(--gray-100); border:1px solid var(--gray-200);
  border-radius:10px; padding:3px; gap:2px; height:32px; box-sizing:border-box;
}
.seg-btn{
  border:none; background:transparent; padding:0 16px; border-radius:8px;
  font-size:12.5px; font-weight:700; color:var(--gray-500);
  transition:background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  white-space:nowrap; height:100%;
}
.seg-btn:hover:not(.active){color:var(--gray-700); background:rgba(255,255,255,0.6);}
.seg-btn.active{background:var(--green-500); color:#fff; box-shadow:0 2px 8px rgba(50,146,68,0.35);}
.btn-clear{
  border:1px solid var(--gray-200); background:var(--white); color:var(--gray-700);
  border-radius:8px; padding:7px 14px; font-size:12.5px; font-weight:600;
  display:flex; align-items:center; gap:6px; height:32px;
  transition:all 0.15s;
}
.btn-clear:hover{border-color:var(--red-600); color:var(--red-600); background:var(--red-50);}
.btn-clear svg{width:13px; height:13px;}
.active-filters-count{
  background:var(--green-500); color:white; border-radius:10px;
  font-size:10px; font-weight:800; padding:1px 6px; margin-left:2px;
}

/* ---- Content area ---- */
.content{padding:22px 28px 60px 28px;}
.view{display:none; animation:fadeIn 0.25s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ---- Insights strip ---- */
.insights-strip{
  display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; margin-bottom:22px;
  scrollbar-width:thin;
}
.insight-card{
  flex:0 0 auto; min-width:238px; max-width:238px;
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-md);
  padding:14px 16px; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:6px;
  border-left:3px solid var(--green-500);
  transition:transform 0.15s, box-shadow 0.15s;
}
.insight-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
.insight-card.warn{border-left-color:var(--amber-600);}
.insight-card.alert{border-left-color:var(--red-600);}
.insight-label{font-size:10.5px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:0.4px; display:flex; align-items:center; gap:5px;}
.insight-label svg{width:12px; height:12px;}
.insight-value{font-family:var(--font-display); font-size:16.5px; font-weight:800; color:var(--gray-900); line-height:1.25;}
.insight-value.small{font-size:13.5px; font-weight:700;}
.insight-sub{font-size:11px; color:var(--gray-500); font-weight:500;}

/* ---- Section header ---- */
.section-header{display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 14px 0;}
.section-header:first-child{margin-top:0;}
.section-title{font-family:var(--font-display); font-size:16px; font-weight:800; color:var(--gray-900); display:flex; align-items:center; gap:8px;}
.section-title svg{width:18px; height:18px; color:var(--green-600);}
.section-hint{font-size:11.5px; color:var(--gray-500); font-weight:500;}

/* ---- KPI Grid ---- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; margin-bottom:8px;}
.kpi-card{
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-md);
  padding:16px 18px; box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column; gap:8px;
  transition:box-shadow 0.15s, transform 0.15s;
  position:relative; overflow:hidden;
}
.kpi-card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
.kpi-top{display:flex; align-items:center; justify-content:space-between;}
.kpi-icon{width:32px; height:32px; border-radius:9px; background:var(--green-50); display:flex; align-items:center; justify-content:center;}
.kpi-icon svg{width:16px; height:16px; color:var(--green-600);}
.kpi-icon.red{background:var(--red-50);} .kpi-icon.red svg{color:var(--red-600);}
.kpi-icon.amber{background:var(--amber-50);} .kpi-icon.amber svg{color:var(--amber-600);}
.kpi-trend{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px;}
.kpi-trend.pos{background:var(--green-50); color:var(--green-700);}
.kpi-trend.neg{background:var(--red-50); color:var(--red-600);}
.kpi-label{font-size:12px; color:var(--gray-500); font-weight:600;}
.kpi-value{font-family:var(--font-display); font-size:23px; font-weight:800; color:var(--gray-900); letter-spacing:-0.3px;}

/* ---- Card / Panel ---- */
.card{
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-lg);
  padding:20px 22px; box-shadow:var(--shadow-sm); margin-bottom:16px;
}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.card-title{font-family:var(--font-display); font-weight:800; font-size:14.5px; color:var(--gray-900);}
.card-title-sub{font-size:11.5px; color:var(--gray-500); font-weight:500; margin-top:2px;}
.card-tools{display:flex; align-items:center; gap:8px;}
.chip-toggle{display:flex; background:var(--gray-100); border-radius:8px; padding:3px; gap:2px;}
.chip-toggle button{
  border:none; background:transparent; padding:5px 11px; border-radius:6px; font-size:11.5px; font-weight:600; color:var(--gray-500);
}
.chip-toggle button.active{background:var(--white); color:var(--green-700); box-shadow:var(--shadow-sm);}

.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:1100px){.grid-2, .grid-3{grid-template-columns:1fr;}}

/* ---- Funnel ---- */
.funnel-wrap{display:flex; gap:26px; align-items:stretch;}
.funnel-visual{flex:1.4; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 0;}
.funnel-stage{
  position:relative; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:filter 0.2s, transform 0.2s;
  margin-bottom:3px;
}
.funnel-stage:hover{filter:brightness(1.06); transform:scale(1.01);}
.funnel-shape{
  height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:white; border-radius:6px; text-align:center; padding:4px 14px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}
.funnel-stage-name{font-size:12.5px; font-weight:800; letter-spacing:0.2px;}
.funnel-stage-meta{font-size:10.5px; font-weight:600; opacity:0.92; margin-top:2px;}
.funnel-conn{font-size:10.5px; color:var(--gray-500); font-weight:700; display:flex; align-items:center; gap:4px; margin:1px 0;}
.funnel-conn svg{width:11px; height:11px;}
.funnel-side{flex:1; display:flex; flex-direction:column; gap:10px; justify-content:center;}
.funnel-leak{
  background:var(--red-50); border:1px solid #F6D4D1; border-radius:var(--radius-md);
  padding:13px 15px;
}
.funnel-leak-title{font-size:11.5px; font-weight:700; color:var(--red-600); display:flex; align-items:center; gap:6px; margin-bottom:4px;}
.funnel-leak-title svg{width:13px; height:13px;}
.funnel-leak-value{font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--gray-900);}
.funnel-leak-sub{font-size:11px; color:var(--gray-500); margin-top:2px;}
.funnel-legend{display:flex; flex-direction:column; gap:7px; font-size:11.5px; color:var(--gray-700); font-weight:500;}
.funnel-legend-item{display:flex; align-items:center; gap:7px;}
.legend-dot{width:8px; height:8px; border-radius:2px; flex-shrink:0;}

/* ---- Tables ---- */
.table-wrap{overflow-x:auto; border-radius:var(--radius-md); border:1px solid var(--gray-200);}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  background:var(--gray-50, #FAFBFA); background:var(--green-50);
  color:var(--green-700); font-weight:700; text-align:left;
  padding:10px 14px; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
  border-bottom:1px solid var(--gray-200); white-space:nowrap; cursor:pointer;
  user-select:none;
}
thead th:hover{background:var(--green-100);}
thead th .sort-arrow{opacity:0.5; margin-left:3px; font-size:9px;}
.col-resize-handle{
  position:absolute; top:0; right:0; width:6px; height:100%; cursor:col-resize; z-index:2;
}
.col-resize-handle:hover, .col-resize-handle.resizing{ background:rgba(50,146,68,0.35); }
.alerta-table thead th{background:var(--green-500); color:#fff; text-align:center; cursor:default;}
.alerta-table thead th:hover{background:var(--green-500);}
.alerta-table tbody td{text-align:center;}
.alerta-table tbody td:first-child{text-align:left;}
tbody td{padding:10px 14px; border-bottom:1px solid var(--gray-100); color:var(--gray-900); white-space:nowrap;}
tbody tr:hover{background:var(--green-50);}
.zebra-table tbody tr:nth-child(odd){background:var(--green-50);}
.zebra-table tbody tr:nth-child(even){background:#FBFCFB;}
.zebra-table tbody tr:hover{background:var(--green-100) !important;}
tbody tr:last-child td{border-bottom:none;}
.rank-badge{
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:6px; background:var(--gray-100); color:var(--gray-700); font-weight:800; font-size:11px;
}
.rank-badge.top{background:var(--green-500); color:white;}
.badge{display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;}
.badge-green{background:var(--green-50); color:var(--green-700);}
.badge-red{background:var(--red-50); color:var(--red-600);}
.badge-amber{background:var(--amber-50); color:var(--amber-600);}
.badge-gray{background:var(--gray-100); color:var(--gray-700);}
.row-overdue{background:var(--red-50) !important;}
.row-soon{background:var(--amber-50) !important;}
.bar-cell{display:flex; align-items:center; gap:8px;}
.bar-track{flex:1; height:6px; background:var(--gray-100); border-radius:4px; overflow:hidden; min-width:60px;}
.bar-fill{height:100%; border-radius:4px; background:var(--green-500);}

/* ---- Region bars (heat ranking, map substitute) ---- */
.region-list{display:flex; flex-direction:column; gap:9px;}
.region-row{display:grid; grid-template-columns:150px 1fr 90px; align-items:center; gap:12px; font-size:12.5px;}
.region-name{font-weight:600; color:var(--gray-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.region-track{height:22px; background:var(--gray-100); border-radius:6px; overflow:hidden; position:relative;}
.region-fill{height:100%; border-radius:6px; display:flex; align-items:center; padding-left:8px;}
.region-fill span{font-size:10.5px; font-weight:700; color:white;}
.region-val{text-align:right; font-weight:700; color:var(--gray-700); font-size:11.5px;}

/* ---- Empty state ---- */
.empty-state{padding:40px 20px; text-align:center; color:var(--gray-500);}
.empty-state svg{width:36px; height:36px; margin-bottom:10px; opacity:0.4;}
.empty-state p{font-size:13px; font-weight:600;}

/* ---- Priority pills ---- */
.pri-Muito-Alta{background:#FDEDEC; color:#C0392B;}
.pri-Alta{background:var(--amber-50); color:var(--amber-600);}
.pri-Média{background:#EAF2FD; color:var(--blue-600);}
.pri-Baixa{background:var(--gray-100); color:var(--gray-700);}

/* ---- Modal ---- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,30,22,0.45); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:30px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--white); border-radius:var(--radius-lg); width:100%; max-width:920px;
  max-height:82vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg);
  animation:modalIn 0.2s ease;
}
@keyframes modalIn{from{opacity:0; transform:scale(0.97) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
.modal-header{padding:18px 24px; border-bottom:1px solid var(--gray-200); display:flex; align-items:center; justify-content:space-between;}
.modal-title{font-family:var(--font-display); font-weight:800; font-size:16px; display:flex; align-items:center; gap:10px;}
.modal-close{width:30px; height:30px; border-radius:8px; border:none; background:var(--gray-100); display:flex; align-items:center; justify-content:center;}
.modal-close svg{width:15px; height:15px;}
.modal-body{padding:0; overflow-y:auto;}

/* ---- Search results dropdown ---- */
.search-results{
  position:absolute; top:calc(100% + 8px); right:28px; width:420px; max-height:360px; overflow-y:auto;
  background:white; border:1px solid var(--gray-200); border-radius:var(--radius-md); box-shadow:var(--shadow-lg);
  display:none; z-index:50;
}
.search-results.open{display:block;}
.search-result-item{padding:11px 16px; border-bottom:1px solid var(--gray-100); cursor:pointer;}
.search-result-item:hover{background:var(--green-50);}
.search-result-item:last-child{border-bottom:none;}
.sr-title{font-weight:700; font-size:12.5px; color:var(--gray-900);}
.sr-meta{font-size:11px; color:var(--gray-500); margin-top:2px;}

/* ---- Stat mini row ---- */
.stat-mini-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
.stat-mini{background:var(--green-50); border-radius:var(--radius-md); padding:13px 15px;}
.stat-mini-label{font-size:10.5px; font-weight:700; color:var(--green-700); text-transform:uppercase; letter-spacing:0.4px;}
.stat-mini-value{font-family:var(--font-display); font-size:17px; font-weight:800; color:var(--gray-900); margin-top:4px;}
@media (max-width:900px){.stat-mini-row{grid-template-columns:repeat(2,1fr);}}

.chart-box{position:relative; height:280px;}
.chart-box.tall{height:340px;}
.chart-box.short{height:220px;}

@media (max-width:900px){
  .sidebar{position:fixed; left:-236px; transition:left 0.2s;}
  .sidebar.open{left:0;}
  .content{padding:16px;}
  .filters-bar{gap:8px;}
  .search-box{width:170px;}
}
</style>
</head>

/* ---------------- Utilidades de formatação ---------------- */
const fmtMoney = (v) => {
  if (Math.abs(v) >= 1000000) return 'R$ ' + (v/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + 'M';
  if (Math.abs(v) >= 1000) return 'R$ ' + (v/1000).toLocaleString('pt-BR',{maximumFractionDigits:0}) + 'mil';
  return 'R$ ' + v.toLocaleString('pt-BR',{maximumFractionDigits:0});
};
const fmtMoneyFull = (v) => 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtNum = (v) => v.toLocaleString('pt-BR');
const fmtPct = (v) => (isFinite(v) ? v.toFixed(1) : '0.0') + '%';
const fmtDate = (iso) => { if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const monthLabel = (ym) => { const [y,m]=ym.split('-'); const names=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; return names[parseInt(m,10)-1]+'/'+y.slice(2); };
const daysBetween = (a,b) => Math.round((b-a)/86400000);
const todayISO = () => new Date().toISOString().slice(0,10);
const parseISO = (iso) => new Date(iso+'T00:00:00');

function escapeHtml(s){
  if (s===null || s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Filtragem central ---------------- */
function getDateRange(){
  if (filters.periodo === 'todos') return null;
  const end = new Date(); end.setHours(23,59,59,999);
  let start = new Date();
  if (filters.periodo === '30') start.setDate(start.getDate()-30);
  else if (filters.periodo === '90') start.setDate(start.getDate()-90);
  else if (filters.periodo === 'mes-atual') start = new Date(end.getFullYear(), end.getMonth(), 1);
  else if (filters.periodo === 'custom') {
    return [filters.dateStart ? parseISO(filters.dateStart) : new Date(2000,0,1), filters.dateEnd ? parseISO(filters.dateEnd) : end];
  }
  return [start, end];
}

function applyFilters(data){
  const range = getDateRange();
  return data.filter(d => {
    if (filters.operacao && d.operacao !== filters.operacao) return false;
    if (filters.vendedor && d.vendedor !== filters.vendedor) return false;
    if (filters.gerente && d.gerente !== filters.gerente) return false;
    if (filters.estagio && d.estagio !== filters.estagio) return false;
    if (filters.estado && d.estado !== filters.estado) return false;
    if (filters.empresa && d.empresa !== filters.empresa) return false;
    if (filters.motivoPerda && d.motivoPerda !== filters.motivoPerda) return false;
    if (filters.probabilidade){
      const [min,max] = filters.probabilidade.split('-').map(Number);
      if (d.probabilidade < min || d.probabilidade > max) return false;
    }
    if (filters.mesFechamento && (!d.fechamentoEsperado || d.fechamentoEsperado.slice(0,7) !== filters.mesFechamento)) return false;
    if (filters.mesCriacao && (!d.dataCriacao || d.dataCriacao.slice(0,7) !== filters.mesCriacao)) return false;
    if (filters.mesFinalizacao && (!d.dataFinalizada || d.dataFinalizada.slice(0,7) !== filters.mesFinalizacao)) return false;
    if (filters.search){
      const s = filters.search.toLowerCase();
      const hay = (d.oportunidade+' '+d.empresa+' '+d.vendedor).toLowerCase();
      if (!hay.includes(s)) return false;
    }
    if (range){
      // Usamos a data de criação: é o único campo de data preenchido tanto para propostas
      // abertas quanto fechadas. "Data da proposta finalizada" só existe para Conquistado/Perdido,
      // então usá-la aqui fazia o funil inteiro (etapas em aberto) sumir ao aplicar um período.
      const dt = d.dataCriacao;
      if (!dt) return false;
      const dd = parseISO(dt);
      if (dd < range[0] || dd > range[1]) return false;
    }
    return true;
  });
}

function activeFilterCount(){
  let n = 0;
  if (filters.periodo !== 'todos') n++;
  ['vendedor','gerente','estagio','estado','empresa','motivoPerda','probabilidade','mesFechamento','mesCriacao','mesFinalizacao'].forEach(k=>{ if(filters[k]) n++; });
  return n;
}

let __tableRegistry = {};

function opportunityRowsHtml(rows, opts={}){
  const showMotivo = opts.showMotivo;

  return rows.map(r=>{
    let diasCell = '';
    if (showDias){
      const dt = r.fechamentoEsperado ? parseISO(r.fechamentoEsperado) : null;
      const dias = dt ? daysBetween(new Date(), dt) : null;
      diasCell = `<td>${dias===null?'—':(dias<0?`<span class="badge badge-red">${Math.abs(dias)}d atrasado</span>`:dias<=3?`<span class="badge badge-amber">${dias}d</span>`:dias+'d')}</td>`;
    }
    return `<tr data-id="${r.id}" class="opp-row" style="cursor:pointer">
      <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(r.oportunidade)}${operacaoBadge(r.operacao)}</td>
      <td>${escapeHtml(r.empresa)}</td>
      <td>${escapeHtml(r.vendedor)}</td>
      <td><span class="badge" style="background:${stageColorAny(r.estagio)}22; color:${stageColorAny(r.estagio)}">${r.estagio}</span></td>
      ${opts.showProbabilidade?`<td class="mono-num">${fmtPct(r.probabilidade)}</td>`:''}
      <td class="mono-num">${fmtMoneyFull(r.valor)}</td>
      ${showMotivo?`<td>${escapeHtml(r.motivoPerda||'Motivo não informado')}</td>`:''}
      ${diasCell}
    </tr>`;
  }).join('');
}

function opportunityTableHtml(rows, opts={}){
  if (!rows.length){
    return `<div class="empty-state">${ICONS.inbox}<p>Nenhuma oportunidade encontrada para este filtro.</p></div>`;
  }
  const showMotivo = opts.showMotivo;
  const showDias = opts.showDias;

  const tid = 'opptbl-' + (__tableIdCounter++);

/* ---------------- Ordenação genérica de cabeçalho (clique em <th data-sort>) ---------------- */
function wireSortableHeaders(container, onSorted){
  container.querySelectorAll('[data-tid] thead th[data-sort]').forEach(th=>{
    if (th.dataset.wired) return;
    th.dataset.wired = '1';
    th.style.cursor = 'pointer';
    if (!th.querySelector('.sort-arrow')) th.insertAdjacentHTML('beforeend', ' <span class="sort-arrow">↕</span>');
    th.addEventListener('click', (e)=>{
      if (e.target.classList.contains('col-resize-handle')) return;
      const wrap = th.closest('[data-tid]');
      const tid = wrap.dataset.tid;
      const state = __tableRegistry[tid];
      if (!state) return;
      const key = th.dataset.sort;
      state.sortDir = (state.sortKey === key) ? state.sortDir*-1 : -1;
      state.sortKey = key;
      state.rows.sort((a,b)=>{
        let av = a[key], bv = b[key];
        const aNull = av===null||av===undefined||av==='';
        const bNull = bv===null||bv===undefined||bv==='';
        if (aNull && bNull) return 0;
        if (aNull) return 1;  // nulos sempre por último, independente da direção
        if (bNull) return -1;
        if (typeof av === 'string' || typeof bv === 'string') return String(av).localeCompare(String(bv)) * state.sortDir;
        return (av-bv) * state.sortDir;
      });
      wrap.querySelectorAll('thead th[data-sort] .sort-arrow').forEach(a=>a.textContent='↕');
      th.querySelector('.sort-arrow').textContent = state.sortDir===1 ? '▲' : '▼';
      onSorted(wrap, state.rows, state.opts);
      makeColumnsResizable(wrap);
    });
  });
}

/* ---------------- Colunas redimensionáveis (arrastar borda do cabeçalho) ---------------- */
function makeColumnsResizable(container){
  container.querySelectorAll('table').forEach(table=>{
    if (table.dataset.resizable) return;
    table.dataset.resizable = '1';
    table.style.tableLayout = 'fixed';
    // com table-layout:fixed, cada célula precisa cortar o próprio conteúdo — senão o texto
    // que não cabe "vaza" visualmente por cima da coluna vizinha em vez de truncar.
    table.querySelectorAll('tbody td').forEach(td=>{
      if (!td.style.whiteSpace) td.style.whiteSpace = 'nowrap';
      if (!td.style.overflow) td.style.overflow = 'hidden';
      if (!td.style.textOverflow) td.style.textOverflow = 'ellipsis';
    });
    table.querySelectorAll('thead th').forEach(th=>{
      th.style.position = 'relative';
      th.style.overflow = 'hidden';
      th.style.textOverflow = 'ellipsis';
      th.style.whiteSpace = 'nowrap';
      if (!th.style.width) th.style.width = th.offsetWidth + 'px';
      const handle = document.createElement('span');
      handle.className = 'col-resize-handle';
      th.appendChild(handle);
      handle.addEventListener('click', e=> e.stopPropagation());
      handle.addEventListener('mousedown', e=>{
        e.preventDefault(); e.stopPropagation();
        const startX = e.pageX, startWidth = th.offsetWidth;
        handle.classList.add('resizing');
        const onMove = e2=>{ th.style.width = Math.max(60, startWidth + (e2.pageX-startX)) + 'px'; };
        const onUp = ()=>{
          handle.classList.remove('resizing');
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  });
}

/* =====================================================================
   KPIs & Insights
   ===================================================================== */
function computeKPIs(fd){
  const total = fd.length;
  const ganhas = fd.filter(d=>d.estagio==='Conquistado');
  const perdidas = fd.filter(d=>curExitStages().includes(d.estagio));
  const taxaConversao = (ganhas.length+perdidas.length) ? (ganhas.length/(ganhas.length+perdidas.length))*100 : 0;
  const porEstagio = {};
  curAllStages().forEach(s=>{ porEstagio[s] = fd.filter(d=>d.estagio===s).length; });
  return { total, ganhas: ganhas.length, perdidas: perdidas.length, taxaConversao, porEstagio };
}

function kpiGridHtml(fd){
  const k = computeKPIs(fd);
  const fStages = curFunnelStages();
  const cards = [
    { label:'Total de propostas', value: fmtNum(k.total), icon:'layers' },
  ];
  fStages.forEach((s,i)=>{
    cards.push({ label:s, value: fmtNum(k.porEstagio[s]), icon: i===fStages.length-1 ? 'flag' : 'trend' });
  });
  curExitStages().forEach(s=>{
    cards.push({ label:s, value: fmtNum(k.porEstagio[s]), icon:'broken', red:true });
  });
  cards.push({ label:'Taxa de conversão', value: fmtPct(k.taxaConversao), icon:'percent' });
  return `<div class="kpi-grid">${cards.map(c=>`

/* =====================================================================
   Funil comercial
   ===================================================================== */
function computeFunnel(fd){
  const fStages = curFunnelStages();
  const counts = {}; const values = {};
  fStages.forEach(s=>{ counts[s]=0; values[s]=0; });
  fd.forEach(d=>{ if (fStages.includes(d.estagio)){ counts[d.estagio]++; values[d.estagio]+=d.valor; } });
  // cumulativo de baixo para cima (quantas oportunidades alcançaram ao menos esta etapa)
  const cum = {}; const cumVal = {};
  let runningC = 0, runningV = 0;
  for (let i=fStages.length-1;i>=0;i--){
    const s = fStages[i];
    runningC += counts[s]; runningV += values[s];
    cum[s] = runningC; cumVal[s] = runningV;
  }
  const total = cum[fStages[0]] || 1;
  const stages = fStages.map((s,i)=>{
    const prev = i>0 ? cum[fStages[i-1]] : null;
    return {
      nome: s, qtdEtapa: counts[s], qtdCumulativa: cum[s], valorCumulativo: cumVal[s], valorEtapa: values[s],
      pctTotal: cum[s]/total*100, pctAnterior: prev ? cum[s]/prev*100 : 100,
    };
  });
  const exits = curExitStages().map(s=>{
    const rows = fd.filter(d=>d.estagio===s);
    return { nome: s, qtd: rows.length, valor: rows.reduce((a,d)=>a+d.valor,0) };
  });
  return { stages, total, exits };
}

/* =====================================================================
   VIEW: Funil & Estágios (detalhado)
   ===================================================================== */
function renderFunilView(fd){
  const funnel = computeFunnel(fd);
  const vc = document.getElementById('viewContainer');

  const abertas = d => d.estagio!=='Conquistado' && !curExitStages().includes(d.estagio);
  const altaProb = fd.filter(d => abertas(d) && d.kwp>50 && d.probabilidade>=75).sort((a,b)=>{
    // ordena por fechamento previsto mais próximo primeiro; sem data definida vai para o fim
    if (!a.fechamentoEsperado && !b.fechamentoEsperado) return b.probabilidade-a.probabilidade;
    if (!a.fechamentoEsperado) return 1;
    if (!b.fechamentoEsperado) return -1;
    return a.fechamentoEsperado.localeCompare(b.fechamentoEsperado);
  });
  const kwpAlta = altaProb.reduce((s,d)=>s+d.kwp,0);

  // Tudo que não entrou acima (grandes com baixa probabilidade + tudo até 50 kWp),
  // agrupado por probabilidade E por faixa de potência — por isso a mesma % pode
  // aparecer duas vezes na tabela: uma linha para >50 kWp e outra para ≤50 kWp.
  const resto = fd.filter(d => abertas(d) && !(d.kwp>50 && d.probabilidade>=75));
  const buckets = {};
  resto.forEach(d=>{
    const tier = d.kwp>50 ? 'grande' : 'pequena';
    const key = d.probabilidade+'|'+tier;
    (buckets[key] ??= {qtd:0, kwp:0, prob:d.probabilidade, tier});
    buckets[key].qtd++;
    buckets[key].kwp+=d.kwp;
  });
  const bucketRows = Object.values(buckets).sort((a,b)=> b.prob-a.prob || (a.tier==='grande'?-1:1));

  // Resumo por mês — Grandes oportunidades (fechamento esperado, sem data agrupada à parte)
  const altaProbPorMes = {};
  altaProb.forEach(d=>{
    const key = d.fechamentoEsperado ? d.fechamentoEsperado.slice(0,7) : '—';
    (altaProbPorMes[key] ??= {qtd:0, kwp:0, valor:0});
    altaProbPorMes[key].qtd++; altaProbPorMes[key].kwp+=d.kwp; altaProbPorMes[key].valor+=d.valor;
  });
  const altaProbMeses = Object.keys(altaProbPorMes).filter(k=>k!=='—').sort();

function openKwpPorMesModal(title, rows){
  const comData = rows.filter(d=>d.fechamentoEsperado);

  comData.forEach(d=>{
    const ym = d.fechamentoEsperado.slice(0,7);
    (porMes[ym] ??= {qtd:0, kwp:0, valor:0});
    porMes[ym].qtd++;
    porMes[ym].kwp += d.kwp;
    porMes[ym].valor += d.valor;
  });
  const meses = Object.keys(porMes).sort();

  openModal(title, `
    <div style="padding:22px 24px;">
      <div class="stat-mini-row">
        <div class="stat-mini"><div class="stat-mini-label">Oportunidades</div><div class="stat-mini-value">${fmtNum(rows.length)}</div></div>

  `);

  wireOpportunityTableSort(document.getElementById('modalBody'));

  if (!meses.length) return;

  const kwpValueLabelPlugin = {
    id: 'kwpValueLabelModal',
    afterDatasetsDraw(chart){
      const { ctx } = chart;
      chart.getDatasetMeta(0).data.forEach((bar, i) => {

        ctx.font = "700 12px Inter, sans-serif";

        ctx.fillText(`${fmtNum(porMes[meses[i]].kwp)} kWp`, bar.x, bar.y - 6);
        ctx.restore();
      });

  };
  makeChart('chartKwpMesModal', {
    type:'bar',
    data:{ labels: meses.map(monthLabel), datasets:[{ data: meses.map(ym=>porMes[ym].kwp), backgroundColor:'#42AE56', borderRadius:6, maxBarThickness:50 }]},

    plugins:[kwpValueLabelPlugin],
  });

function probabilityTableHtml(rows){
  if (!rows.length){
    return `<div class="empty-state">${ICONS.inbox}<p>Nenhuma oportunidade em aberto acima de 50 kWp com probabilidade ≥ 75%.</p></div>`;
  }
  const tid = 'probtbl-' + (__tableIdCounter++);
  __tableRegistry[tid] = { rows: [...rows], opts:{}, sortKey:null, sortDir:-1 };
  return `
    <div class="table-wrap" data-tid="${tid}" style="border:none;">
      <table class="zebra-table">
        <thead><tr><th>Empresa</th><th>Vendedor</th><th>Gerente</th><th data-sort="kwp">kWp</th><th data-sort="probabilidade">Probabilidade</th><th>Estágio</th><th data-sort="fechamentoEsperado">Mês previsto</th></tr></thead>
        <tbody>${probabilityRowsHtml(rows)}</tbody>
      </table>
    </div>`;
}

/* =====================================================================
   Ranking de Vendedores (reutilizável em Visão Geral e Vendedores)
   ===================================================================== */
function computeVendorRanking(fd){
  // Propostas perdidas e desqualificadas não entram mais na visão por vendedor —
  // elas passaram a ser tratadas exclusivamente na seção "Propostas Perdidas".
  const scoped = fd.filter(d => !curExitStages().includes(d.estagio));
  const byVend = {};
  scoped.forEach(d=>{ (byVend[d.vendedor] ??= []).push(d); });
  const rows = Object.entries(byVend).map(([v,items])=>{
    const ganhas = items.filter(i=>i.estagio==='Conquistado');
    const valorTotal = items.reduce((s,i)=>s+i.valor,0);
    const valorGanho = ganhas.reduce((s,i)=>s+i.valor,0);
    return {
      vendedor: v, qtd: items.length, valorTotal, ticketMedio: valorTotal/items.length,
      ganhas: ganhas.length, valorGanho,
      valorMedioGanho: ganhas.length? valorGanho/ganhas.length : 0,
    };
  }).sort((a,b)=>b.valorTotal-a.valorTotal);
  return { byVend, rows };
}

        <tbody>

            <tr class="vend-row" data-v="${escapeHtml(r.vendedor)}" style="cursor:pointer;">

/* =====================================================================
   Ranking de Empresas / Clientes (com detalhamento por estágio)
   ===================================================================== */
function computeEmpresaRanking(fd){
  const byEmp = {};
  fd.forEach(d=>{
    (byEmp[d.empresa] ??= {qtd:0, valor:0, estagios:{}});
    byEmp[d.empresa].qtd++;
    byEmp[d.empresa].valor += d.valor;
    byEmp[d.empresa].estagios[d.estagio] = (byEmp[d.empresa].estagios[d.estagio]||0)+1;
  });
  return Object.entries(byEmp).map(([e,v])=>({empresa:e,...v})).sort((a,b)=>b.valor-a.valor);
}

    ${empresas.length>limit?`<div class="section-hint" style="margin-top:10px;">Mostrando as ${limit} principais de ${empresas.length} empresas identificadas.</div>`:''}`;
}

function wireEmpresaRowClicks(container, fd){
  container.querySelectorAll('.emp-row').forEach(el=>{
    el.addEventListener('click', ()=>{
      const rows = fd.filter(d=>d.empresa===el.dataset.e);
      openModal(`Propostas de ${escapeHtml(el.dataset.e)}`, opportunityTableHtml(rows, {modal:true}));
      wireOppRowClicks(document.getElementById('modalBody'));
      wireOpportunityTableSort(document.getElementById('modalBody'));
    });
  });
}

  const porExit = exitList.map(s=>({ nome:s, qtd: perdidas.filter(d=>d.estagio===s).length }));

    const totalB = Object.values(porGerente[b].motivos).reduce((s,m)=>s+m.qtd,0);
    return totalB-totalA;

  // Perdas por estado — recorte de segmento (não há coluna "Produto" na base atual)
  const porEstado = {};

/* =====================================================================
   VIEW: Alertas de Fechamento
   ===================================================================== */
function renderAlertasView(fd){
  const now = new Date(); now.setHours(0,0,0,0);
  const comData = fd.filter(d=>d.fechamentoEsperado && d.estagio!=='Conquistado' && !curExitStages().includes(d.estagio));
  const vencidas = comData.filter(d=>parseISO(d.fechamentoEsperado)<now)
    .sort((a,b)=>parseISO(a.fechamentoEsperado)-parseISO(b.fechamentoEsperado));
  const proximos = comData.filter(d=>parseISO(d.fechamentoEsperado)>=now)
    .sort((a,b)=>parseISO(a.fechamentoEsperado)-parseISO(b.fechamentoEsperado));
  const venceEm3 = proximos.filter(d=>{ const dias=daysBetween(now, parseISO(d.fechamentoEsperado)); return dias<=3; });

  const monthOnly = (iso) => { const s = parseISO(iso).toLocaleDateString('pt-BR',{month:'long'}); return s.charAt(0).toUpperCase()+s.slice(1); };

  const alertaRowsHtml = (rows) => rows.map(d=>{
    const dias = daysBetween(now, parseISO(d.fechamentoEsperado));
    const cls = dias<0 ? 'row-overdue' : (dias<=3 ? 'row-soon' : '');
    const diasTxt = dias<0 ? `${Math.abs(dias)}d atrasado` : `${dias}d restantes`;
    return `<tr class="opp-row ${cls}" data-id="${d.id}" style="cursor:pointer;">
      <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(d.empresa)}${operacaoBadge(d.operacao)}</td>
      <td class="mono-num">${d.kwp ? fmtNum(d.kwp) : '—'}</td>
      <td class="mono-num">${fmtMoneyFull(d.valor)}</td>
      <td class="mono-num">${Math.round(d.probabilidade)}</td>
      <td style="text-transform:uppercase;">${monthOnly(d.fechamentoEsperado)}</td>
      <td><span class="badge" style="background:${stageColorAny(d.estagio)}22; color:${stageColorAny(d.estagio)}">${d.estagio}</span></td>
      <td><span class="badge ${dias<0?'badge-red':dias<=3?'badge-amber':'badge-gray'}">${diasTxt}</span></td>
    </tr>`;
  }).join('');

  const rowsTable = (rows, opts={}) => {
    if (!rows.length) return `<div class="empty-state">${ICONS.bell}<p>${opts.emptyMsg||'Nenhuma proposta encontrada para os filtros atuais.'}</p></div>`;
    const tid = 'alerttbl-' + (__tableIdCounter++);
    __tableRegistry[tid] = { rows:[...rows], opts:{}, sortKey:null, sortDir:-1 };
    return `
    <div class="table-wrap" data-tid="${tid}" style="border:none;">
      <table class="alerta-table">
        <thead><tr><th>Clientes</th><th data-sort="kwp">KWp</th><th data-sort="valor">Valor</th><th data-sort="probabilidade">%</th><th>Mês</th><th>Status</th><th>Dias restantes</th></tr></thead>
        <tbody>${alertaRowsHtml(rows)}</tbody>
      </table>
    </div>`;
  };

  const vc = document.getElementById('viewContainer');
  vc.innerHTML = `
    <div class="stat-mini-row">
      <div class="stat-mini"><div class="stat-mini-label">Próximas do fechamento</div><div class="stat-mini-value">${fmtNum(proximos.length)}</div></div>
      <div class="stat-mini" style="background:var(--red-50);"><div class="stat-mini-label" style="color:var(--red-600)">Vencidas</div><div class="stat-mini-value">${fmtNum(vencidas.length)}</div></div>
      <div class="stat-mini" style="background:var(--amber-50);"><div class="stat-mini-label" style="color:var(--amber-600)">Vencem em até 3 dias</div><div class="stat-mini-value">${fmtNum(venceEm3.length)}</div></div>
      <div class="stat-mini"><div class="stat-mini-label">Valor em jogo</div><div class="stat-mini-value">${fmtMoney([...vencidas,...proximos].reduce((s,d)=>s+d.valor,0))}</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Propostas Próximas do Fechamento</div><div class="card-title-sub">Todas as propostas em aberto com fechamento esperado futuro · amarelo = vence em até 3 dias</div></div>
      </div>
      ${rowsTable(proximos, {emptyMsg:'Nenhuma proposta com fechamento esperado futuro para os filtros atuais.'})}
    </div>

    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Data de fechamento vencida</div><div class="card-title-sub">Fechamento esperado já passou e a proposta segue em aberto</div></div>
      </div>
      ${rowsTable(vencidas, {emptyMsg:'Nenhuma proposta vencida para os filtros atuais.'})}
    </div>
  `;
  wireOppRowClicks(vc);
  wireSortableHeaders(vc, (wrap, rows)=>{
    wrap.querySelector('tbody').innerHTML = alertaRowsHtml(rows);
    wireOppRowClicks(wrap);
  });
  makeColumnsResizable(vc);
}

/* =====================================================================
   VIEW: Para Revisar — oportunidades com dados importantes faltando
   ===================================================================== */
function computeIssues(d){
  const issues = [];
  const emAberto = d.estagio!=='Conquistado' && !curExitStages().includes(d.estagio);
  const fechada = d.estagio==='Conquistado' || curExitStages().includes(d.estagio);

  if (!d.kwp) issues.push('kWp não informado');
  if (curExitStages().includes(d.estagio) && !d.motivoPerda) issues.push('Motivo da perda não informado');
  if (d.empresa === 'Não identificado') issues.push('Empresa não identificada');
  if (d.estado === 'Não informado') issues.push('Estado não informado');
  if (!d.vendedor || d.vendedor === 'Não Informado') issues.push('Vendedor não informado');
  if (!d.valor) issues.push('Valor não informado');
  if (!d.probabilidade) issues.push('Probabilidade não informada');
  if (!d.dataCriacao) issues.push('Data de criação não informada');
  if (emAberto && !d.fechamentoEsperado) issues.push('Fechamento esperado não informado');
  if (fechada && !d.dataFinalizada) issues.push('Data de finalização não informada');
  if (d.estagio==='Conquistado' && !d.dataFechamento) issues.push('Data de fechamento não informada');
  if (d.gerente === 'Não mapeado') issues.push('Gerente não mapeado');
  return issues;
}

function revisarRowsHtml(rows){
  return rows.map(d=>`
    <tr data-id="${d.id}" class="opp-row" style="cursor:pointer">
      <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(d.oportunidade)}${operacaoBadge(d.operacao)}</td>
      <td>${escapeHtml(d.empresa)}</td>
      <td>${escapeHtml(d.vendedor)}</td>
      <td><span class="badge" style="background:${stageColorAny(d.estagio)}22; color:${stageColorAny(d.estagio)}">${d.estagio}</span></td>
      <td style="white-space:normal; min-width:220px;">${d.__issues.map(i=>`<span class="badge badge-amber" style="margin:2px 3px 2px 0;">${escapeHtml(i)}</span>`).join('')}</td>
      <td class="mono-num">${fmtMoneyFull(d.valor)}</td>
    </tr>`).join('');
}

let revisarSubTab = 'aberto'; // 'aberto' | 'perdidas'
let revisarDeselecionados = { aberto: new Set(), perdidas: new Set() }; // tipos de pendência desmarcados, por aba

function renderRevisarView(fd){
  const todasComIssues = fd.filter(d=>d.estagio!=='Conquistado').map(d=>({...d, __issues: computeIssues(d)})).filter(d=>d.__issues.length>0);
  const abertosBase = todasComIssues.filter(d=>!curExitStages().includes(d.estagio));
  const perdidasBase = todasComIssues.filter(d=>curExitStages().includes(d.estagio));
  const baseAtual = revisarSubTab==='perdidas' ? perdidasBase : abertosBase;
  const deselAtual = revisarDeselecionados[revisarSubTab];

  const contagemPorTipo = {};
  baseAtual.forEach(d=>d.__issues.forEach(i=>{ contagemPorTipo[i]=(contagemPorTipo[i]||0)+1; }));
  const tipos = Object.entries(contagemPorTipo).sort((a,b)=>b[1]-a[1]).map(([tipo])=>tipo);

  // esquece seleções de tipos que não existem mais (ex: trocou de operação/filtro)
  deselAtual.forEach(t=>{ if (!tipos.includes(t)) deselAtual.delete(t); });

  const selecionados = tipos.filter(t=>!deselAtual.has(t));
  const withIssues = baseAtual.filter(d=>d.__issues.some(i=>selecionados.includes(i)));

  const vc = document.getElementById('viewContainer');
  vc.innerHTML = `
    <div class="seg-control" id="revisarSubTabToggle" style="display:inline-flex; margin-bottom:16px;">
      <button type="button" class="seg-btn ${revisarSubTab==='aberto'?'active':''}" data-tab="aberto">Em aberto · ${fmtNum(abertosBase.length)}</button>
      <button type="button" class="seg-btn ${revisarSubTab==='perdidas'?'active':''}" data-tab="perdidas">Perdidas · ${fmtNum(perdidasBase.length)}</button>
    </div>

    <div class="stat-mini-row">
      <div class="stat-mini"><div class="stat-mini-label">Oportunidades a revisar</div><div class="stat-mini-value">${fmtNum(withIssues.length)}</div></div>
      <div class="stat-mini"><div class="stat-mini-label">% do total filtrado</div><div class="stat-mini-value">${fmtPct(fd.length?withIssues.length/fd.length*100:0)}</div></div>
      <div class="stat-mini"><div class="stat-mini-label">Valor envolvido</div><div class="stat-mini-value">${fmtMoney(withIssues.reduce((s,d)=>s+d.valor,0))}</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Filtrar por tipo de pendência</div><div class="card-title-sub">Mostra propostas com pelo menos um dos tipos marcados abaixo</div></div>
        <div class="card-tools">
          <button type="button" id="revisarSelAll" class="btn-clear" style="padding:5px 10px; font-size:11px;">Marcar todos</button>
          <button type="button" id="revisarSelNone" class="btn-clear" style="padding:5px 10px; font-size:11px;">Desmarcar todos</button>
        </div>
      </div>
      ${tipos.length ? `
      <div style="display:flex; flex-wrap:wrap; gap:10px;">
        ${tipos.map(tipo => `
          <label style="display:flex; align-items:center; gap:7px; background:var(--gray-100); border-radius:9px; padding:7px 13px; font-size:12.5px; font-weight:600; color:var(--gray-700); cursor:pointer;">
            <input type="checkbox" class="revisar-tipo-chk" value="${escapeHtml(tipo)}" ${deselAtual.has(tipo)?'':'checked'}>
            ${escapeHtml(tipo)} · ${fmtNum(contagemPorTipo[tipo])}
          </label>`).join('')}
      </div>` : `<span class="section-hint">Nenhuma pendência encontrada nesta aba.</span>`}
    </div>

    <div class="card">
      <div class="card-head"><div><div class="card-title">Oportunidades com pendências</div><div class="card-title-sub">Clique numa linha para abrir e completar o cadastro</div></div></div>
      ${withIssues.length ? `
      <div class="table-wrap" data-tid="revisar-tbl" style="border:none;">
        <table>
          <thead><tr><th>Oportunidade</th><th>Empresa</th><th>Vendedor</th><th>Estágio</th><th>Pendências</th><th data-sort="valor">Valor</th></tr></thead>
          <tbody>${revisarRowsHtml(withIssues)}</tbody>
        </table>
      </div>` : `<div class="empty-state">${ICONS.sparkle}<p>Nenhuma oportunidade com pendência para os tipos marcados. 🎉</p></div>`}
    </div>
  `;
  wireOppRowClicks(vc);
  if (withIssues.length){
    __tableRegistry['revisar-tbl'] = { rows: withIssues, opts:{}, sortKey:null, sortDir:-1 };
    wireSortableHeaders(vc, (wrap, rows)=>{
      wrap.querySelector('tbody').innerHTML = revisarRowsHtml(rows);
      wireOppRowClicks(wrap);
    });
  }
  makeColumnsResizable(vc);

  vc.querySelectorAll('#revisarSubTabToggle .seg-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if (revisarSubTab === btn.dataset.tab) return;
      revisarSubTab = btn.dataset.tab;
      renderRevisarView(fd);
    });
  });

  vc.querySelectorAll('.revisar-tipo-chk').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if (chk.checked) deselAtual.delete(chk.value);
      else deselAtual.add(chk.value);
      renderRevisarView(fd);
    });
  });
  const selAllBtn = document.getElementById('revisarSelAll');
  const selNoneBtn = document.getElementById('revisarSelNone');
  if (selAllBtn) selAllBtn.addEventListener('click', ()=>{ deselAtual.clear(); renderRevisarView(fd); });
  if (selNoneBtn) selNoneBtn.addEventListener('click', ()=>{ tipos.forEach(t=>deselAtual.add(t)); renderRevisarView(fd); });
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadDataFromSupabase(){
  let all = [];
  let from = 0;
  const pageSize = 1000;
  while (true){
    const { data, error } = await sb.from('oportunidades').select('*').range(from, from + pageSize - 1);
    if (error) throw new Error('Erro ao buscar dados do Supabase: ' + error.message);
    if (!data || !data.length) break;
    all = all.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }
  if (!all.length) throw new Error('Nenhuma oportunidade encontrada na tabela. Confira se a importação do CSV foi concluída.');
  return all.map((row, i) => ({
    id: row.id ?? i,
    oportunidade: row.oportunidade || 'Sem nome',
    estagio: row.estagio,
    estado: row.estado,
    cidade: null,
    vendedor: row.vendedor,
    valor: Number(row.valor) || 0,
    kwp: Number(row.kwp) || 0,
    motivoPerda: row.motivo_perda,
    probabilidade: Number(row.probabilidade) || 0,
    dataCriacao: row.data_criacao,
    fechamentoEsperado: row.fechamento_esperado,
    dataFinalizada: row.data_finalizada,
    dataFechamento: row.data_fechamento,
    empresa: row.empresa,
    comentario: null,
    operacao: row.operacao,
  }));
}

/* ---------------- Login ---------------- */
function showLoginGate(errorMsg){
  document.getElementById('app').innerHTML = `
    <div style="width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; font-family:'Inter',sans-serif; background:var(--bg);">
      <div style="width:100%; max-width:360px; background:var(--white); border:1px solid var(--gray-200); border-radius:18px; padding:36px 32px; box-shadow:var(--shadow-md); text-align:center;">
        <div style="width:44px; height:44px; border-radius:12px; background:var(--green-500); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-family:'Manrope',sans-serif; font-weight:800; font-size:16px;">AZ</div>
        <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:17px; color:var(--gray-900); margin-bottom:4px;">AMARANZERO</div>
        <div style="font-size:12.5px; color:var(--gray-500); margin-bottom:22px;">Entre com sua conta para acessar o dashboard</div>
        <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username"
          style="width:100%; box-sizing:border-box; border:1px solid var(--gray-200); border-radius:10px; padding:11px 14px; font-size:13.5px; text-align:center; outline:none; margin-bottom:10px;">
        <input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password"
          style="width:100%; box-sizing:border-box; border:1px solid var(--gray-200); border-radius:10px; padding:11px 14px; font-size:13.5px; text-align:center; outline:none; margin-bottom:10px;">
        <div id="loginError" style="color:var(--red-600); font-size:12px; font-weight:600; min-height:16px; margin-bottom:10px;">${errorMsg ? escapeHtml(errorMsg) : ''}</div>
        <button id="loginSubmit" style="width:100%; background:var(--green-500); color:#fff; border:none; border-radius:10px; padding:11px; font-size:13.5px; font-weight:700; cursor:pointer;">Entrar</button>
      </div>
    </div>
  `;
  const emailInput = document.getElementById('loginEmail');
  const passwordInput = document.getElementById('loginPassword');
  const errorEl = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmit');
  const tryLogin = async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password){
      errorEl.textContent = 'Preencha e-mail e senha.';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error){
      if (error.message && /fetch|network|failed to fetch/i.test(error.message)){
        errorEl.textContent = 'Não consegui conectar ao servidor. Confira sua internet e tente de novo.';
      } else {
        errorEl.textContent = 'E-mail ou senha incorretos.';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
      passwordInput.value = '';
      passwordInput.focus();
      return;
    }
    bootstrap();
  };
  submitBtn.addEventListener('click', tryLogin);
  [emailInput, passwordInput].forEach(el=>{
    el.addEventListener('keydown', (e)=>{ if (e.key==='Enter') tryLogin(); });
  });
  emailInput.focus();
}

async function logout(){
  await sb.auth.signOut();
  showLoginGate();
}

async function initApp(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    bootstrap();
  } else {
    showLoginGate();
  }
}

document.addEventListener('DOMContentLoaded', initApp);
